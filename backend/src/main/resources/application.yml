spring:
  application:
    name: dorm-api
  datasource:
    url: ${DORM_DB_URL}
    username: ${DORM_DB_USERNAME}
    password: ${DORM_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: always
    timeout: 30m

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${DORM_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

dorm:
  storage-path: ${DORM_STORAGE_PATH:./storage}
  audit-retention-days: ${DORM_AUDIT_RETENTION_DAYS:365}
  max-page-size: ${DORM_MAX_PAGE_SIZE:200}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] traceId=%X{traceId:-} %logger{36} - %msg%n"
