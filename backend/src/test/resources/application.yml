spring:
  datasource:
    url: jdbc:h2:mem:dormtest;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  session:
    store-type: none

dorm:
  storage-path: ./target/test-storage
  audit-retention-days: 365
  max-page-size: 200
